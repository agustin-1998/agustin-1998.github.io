    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      ;(function () {
        var m = document.documentElement.getAttribute('data-theme')
        if (m !== 'light' && m !== 'dark') {
          try { m = localStorage.getItem('theme') } catch (e) {}
        }
        if (m !== 'light' && m !== 'dark') {
          m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (m === 'dark') document.documentElement.classList.add('app-dark')
      })()
    </script>
